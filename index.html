<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ee">
  <meta name="description" content="一个正在更新的个人主页。">
  <title>你好！</title>
  <style>
    :root { color-scheme: light; --paper:#f5f3ee; --ink:#20231f; --muted:#777b72; --line:#d9dbd2; --accent:#496b52; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .page { width:min(100% - 48px, 900px); margin:0 auto; }
    header { height:82px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); font-size:14px; }
    .brand { font-weight:700; letter-spacing:.04em; }
    .availability { color:var(--muted); }
    main { padding:clamp(80px, 15vw, 150px) 0 100px; }
    .eyebrow { color:var(--accent); font-size:13px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
    h1 { max-width:760px; margin:24px 0; font-size:clamp(48px, 9vw, 92px); line-height:1.08; letter-spacing:-.065em; font-weight:650; }
    .intro { max-width:570px; color:#5e625b; font-size:clamp(17px, 2.3vw, 20px); line-height:1.9; }
    .socials { margin-top:76px; border-top:1px solid var(--line); }
    .social-row { display:grid; grid-template-columns:150px 1fr auto; gap:20px; align-items:center; min-height:76px; border-bottom:1px solid var(--line); text-decoration:none; color:inherit; transition:color .2s, padding .2s; }
    .social-row:hover { color:var(--accent); padding-left:8px; }
    .platform { font-weight:650; }
    .handle { color:var(--muted); font-size:14px; }
    .arrow { font-size:20px; }
    .note { margin-top:22px; color:var(--muted); font-size:13px; }
    footer { border-top:1px solid var(--line); padding:24px 0 32px; color:var(--muted); font-size:13px; display:flex; justify-content:space-between; gap:16px; }
    @media (max-width:600px) { .page { width:min(100% - 36px, 900px); } header { height:68px; } main { padding-top:88px; } .socials { margin-top:58px; } .social-row { grid-template-columns:100px 1fr auto; gap:10px; min-height:70px; } .handle { font-size:12px; overflow-wrap:anywhere; } footer { flex-direction:column; } }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">欢迎 / Welcome</div>
      <div class="availability">个人主页 · 持续更新</div>
    </header>
    <main>
      <div class="eyebrow">Hello, internet</div>
      <h2>你好，欢迎来到我的主页。</h2>
      <p class="intro">我会在这里分享正在做的事、喜欢的东西，以及生活里的小发现。欢迎通过下面的平台找到我。</p>
      <section class="socials" aria-label="社交账号">
        <!-- 把每个 href 改成对应主页链接，把“@你的账号”改成账号名。 -->
        <a class="social-row" href=" https://v.douyin.com/MXgm3WyjexQ" target="_blank" rel="noopener noreferrer">
          <span class="platform">抖音</span><span class="handle">@墨鸢的飞行日记</span><span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="social-row" href="https://space.bilibili.com/28730786" target="_blank" rel="noopener noreferrer">
          <span class="platform">哔哩哔哩</span><span class="handle">@-墨鳶-</span><span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="social-row" href="https://www.xiaohongshu.com/user/profile/616eaa2300000000020208ec" target="_blank" rel="noopener noreferrer">
          <span class="platform">小红书</span><span class="handle">@-墨鸢-</span><span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="social-row" href="mailto:cxa1535@gmail.com">
          <span class="platform">邮箱</span><span class="handle">cxa1535@gmail.com</span><span class="arrow" aria-hidden="true">↗</span>
        </a>
      </section>
    </main>
    <footer><span>© 2026 MoyuanX</span><span>谢谢你来这里。</span></footer>
  </div>
</body>
</html>
